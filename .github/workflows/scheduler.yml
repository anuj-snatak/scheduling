name: EC2 Scheduler Stable

on:
  schedule:
    - cron: '30 3 * * 1-5'    # 9:00 AM IST → START
    - cron: '30 13 * * 1-5'   # 7:00 PM IST → STOP
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  INSTANCE_IDS: i-066da3db8d10f1f49
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get instance state
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_IDS \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          echo "STATE=$STATE" >> $GITHUB_ENV
          echo "Current state: $STATE"

      - name: Decide action
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "30 3 * * 1-5" ]]; then
              echo "ACTION=start" >> $GITHUB_ENV
            elif [[ "${{ github.event.schedule }}" == "30 13 * * 1-5" ]]; then
              echo "ACTION=stop" >> $GITHUB_ENV
            fi
          else
            if [[ "$STATE" == "running" ]]; then
              echo "ACTION=stop" >> $GITHUB_ENV
            else
              echo "ACTION=start" >> $GITHUB_ENV
            fi
          fi

      - name: Start instance
        if: env.ACTION == 'start' && env.STATE != 'running'
        run: |
          echo "Starting instance..."
          aws ec2 start-instances --instance-ids $INSTANCE_IDS

      - name: Stop instance
        if: env.ACTION == 'stop' && env.STATE != 'stopped'
        run: |
          echo "Stopping instance..."
          aws ec2 stop-instances --instance-ids $INSTANCE_IDS

      - name: Verify final state
        run: |
          sleep 20
          FINAL=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_IDS \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          echo "Final state: $FINAL"
