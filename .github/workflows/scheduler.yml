name: EC2 Scheduler Stable

on:
  schedule:
    - cron: '36 11 * * *'   # 5:03 PM IST → START
    - cron: '40 11 * * *'   # 5:06 PM IST → STOP
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop

permissions:
  id-token: write
  contents: read

env:
  INSTANCE_IDS: i-066da3db8d10f1f49
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Current UTC time: $(date -u)"
          echo "Current IST time: $(TZ='Asia/Kolkata' date)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Determine Action from Schedule
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "33 11 * * *" ]]; then
            echo "ACTION=start" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "36 11 * * *" ]]; then
            echo "ACTION=stop" >> $GITHUB_ENV
          else
            echo "ACTION=unknown" >> $GITHUB_ENV
          fi

      - name: Get Current Instance State
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_IDS \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          echo "Current state: $STATE"
          echo "STATE=$STATE" >> $GITHUB_ENV

      - name: Execute Action
        run: |
          echo "Intended Action : $ACTION"
          echo "Current State   : $STATE"
          if [[ "$ACTION" == "start" && "$STATE" != "running" ]]; then
            echo "Starting instance..."
            aws ec2 start-instances --instance-ids $INSTANCE_IDS
          elif [[ "$ACTION" == "stop" && "$STATE" != "stopped" ]]; then
            echo "Stopping instance..."
            aws ec2 stop-instances --instance-ids $INSTANCE_IDS
          elif [[ "$ACTION" == "unknown" ]]; then
            echo "ERROR: Schedule pehchana nahi gaya"
            exit 1
          else
            echo "Instance already in desired state ($STATE). Koi action nahi."
          fi

      - name: Wait and Verify Final State
        run: |
          echo "20 seconds wait kar rahe hain..."
          sleep 20
          FINAL_STATE=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_IDS \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          echo "Final state: $FINAL_STATE"
